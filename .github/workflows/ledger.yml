name: Ledger check

on:
  pull_request:
    paths:
      - "docs/ledger/**"
      - "scripts/ledger.mjs"
      - ".github/workflows/ledger.yml"
  push:
    branches:
      - main
    paths:
      - "docs/ledger/**"
      - "scripts/ledger.mjs"
      - ".github/workflows/ledger.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ledger.mjs check
